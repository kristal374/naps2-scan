repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--strict, src/]
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2
          - pillow>=12
          - pythonnet>=3
        exclude: ^(tests/|examples/|setup.py)