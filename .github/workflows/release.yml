name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: windows-latest
            name: windows-arm64
            env: { NAPS2_SCAN_RID: win-arm64 }
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-latest
            name: linux-arm64
            env: { NAPS2_SCAN_RID: linux-arm64 }
          - os: macos-13
            name: macos-x64
          - os: macos-14
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install macOS workload
        if: runner.os == 'macOS'
        run: dotnet workload install macos

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        env: ${{ matrix.env }}
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
