name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-14
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        env:
          NAPS2_SCAN_RID: ${{ matrix.rid }}
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.rid }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-wheels
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: uv build --sdist --out-dir sdist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            sdist/*.tar.gz
