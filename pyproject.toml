[project]
name = "naps2-scan"
version = "0.1.0"
description = "Python wrapper over NAPS2.Sdk via pythonnet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pythonnet>=3.0.4",
]

[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["naps2_scan", "naps2_scan.core", "naps2_scan.asyncio", "naps2_scan.sync"]

[tool.setuptools.package-data]
"naps2_scan.core" = ["native_bin/*"]

[tool.setuptools.exclude-package-data]
"naps2_scan" = ["native/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "setuptools>=83.0",
]

[tool.pytest.ini_options]
markers = [
    "real_scanner: test that requires a connected physical scanner",
]
addopts = "--cov=src/naps2_scan --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["src/naps2_scan"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
