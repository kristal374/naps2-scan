[project]
name = "naps2-bridge"
version = "0.1.0"
description = "Python wrapper over NAPS2.Sdk via pythonnet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pythonnet>=3.0.4",
]

[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"naps2_bridge.bridge" = ["native_bin/*"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["naps2_bridge.native/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "setuptools>=61.0",
]
