[project]
name = "naps2-scan"
version = "0.1.2"
description = "Python wrapper over NAPS2.Sdk via pythonnet"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "kristal", email = "mail.aleks.for.work@gmail.com" },
]
keywords = ["scanner", "naps2", "twain", "wia", "sane", "escl", "scanning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pythonnet>=3.0.4",
]

[project.urls]
Homepage = "https://github.com/kristal374/naps2_bridge"
Repository = "https://github.com/kristal374/naps2_bridge"
Issues = "https://github.com/kristal374/naps2_bridge/issues"

[build-system]
requires = ["setuptools>=83.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["naps2_scan", "naps2_scan.core", "naps2_scan.asyncio", "naps2_scan.sync"]

[tool.setuptools.package-data]
"naps2_scan.core" = ["native_bin/*"]

[tool.setuptools.exclude-package-data]
"naps2_scan" = ["native/*"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "setuptools>=83.0",
]

[tool.pytest.ini_options]
markers = [
    "real_scanner: test that requires a connected physical scanner",
]
addopts = "--cov=src/naps2_scan --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["src/naps2_scan"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[tool.ruff.lint]
extend-select = ["E402"]

[tool.ruff.format]
exclude = ["setup.py"]
